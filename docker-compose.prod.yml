services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    command:  gunicorn full_cost.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/home/fullcost/src/fullcoster/staticfiles
    expose:
      - 8000
    env_file:
      - ./.env.prod
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.prod.db

  nginx:
    build: ./nginx
    volumes:
      - static_volume:/home/fullcost/src/fullcoster/staticfiles
    ports:
      - 80:80
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume: